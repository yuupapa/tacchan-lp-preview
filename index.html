<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>場所に縛られない働き方｜無料セミナー</title>
<meta name="description" content="自由な暮らしを始めるために、最初に整えるべき環境と具体的なステップを無料セミナーでお伝えします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* v22: locked copy (soft mid CTA after scene 3; final CTA eyebrow trimmed, lead removed, new button label); all 6 scene stills regenerated as wide-FOV film placeholders. v21: desktop telops enlarged (~+29%). v20: desktop bg cover anchored bottom; text anchor locked against iOS URL-bar scroll drift */
  :root { --accent: #d4a574; --accent-light: #e8c39a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a0a0a; color: #fff; }
  body { font-family: "Noto Sans JP", sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  .bg {
    position: fixed; top: 0; left: 0; right: 0; z-index: 0;
    height: 100svh;
    transition: opacity 0.8s ease;
    pointer-events: none;
    background-color: #14110e;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,8,10,.06) 0%, rgba(8,8,10,.12) 50%, rgba(8,8,10,.08) 100%);
  }
  #bg6::after {
    background: linear-gradient(180deg, rgba(8,8,10,.06) 0%, rgba(8,8,10,.12) 30%, transparent 50%),
                linear-gradient(to top, rgba(8,8,10,.55) 0%, rgba(8,8,10,.22) 40%, transparent 70%);
  }
  /* Background mapping (v22): all 6 stills regenerated as wide-FOV film placeholders
     bg1 (morning wake) ← scene-morning.jpg (tiny camper van on vast misty dawn lakeshore)
     bg2 (travel/freedom) ← scene-travel.jpg (tiny van on sweeping coastal morning road)
     bg3 (community/仲間) ← scene-community.jpg (distant campfire gathering by dusk lake)
     bg4 (work+life) ← scene-work.jpg (tiny laptop table + van in bright mountain meadow)
     bg5 (decision/夕日) ← scene-sunset.jpg (bottom-weighted sunset sky, tiny van silhouette)
     bg6 (CTA) ← scene-dusk.jpg (dark blue-hour calm, tiny warm van window light)
  */
  #bg1 { background-image: url("scene-morning.jpg?v=22"); }
  #bg2 { background-image: url("scene-travel.jpg?v=22"); }
  #bg3 { background-image: url("scene-community.jpg?v=22"); }
  #bg4 { background-image: url("scene-work.jpg?v=22"); }
  #bg5 { background-image: url("scene-sunset.jpg?v=22"); }
  #bg6 { background-image: url("scene-dusk.jpg?v=22"); }
  #glyph-canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 2;
    pointer-events: none;
    /* sized in explicit px by particles.js, never stretched by CSS —
       keeps the text anchor fixed when the iOS URL bar shows/hides */
  }
  .content { position: relative; z-index: 3; }
  section.beat {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.25rem;
  }
  /* Fallback / reduced-motion text — no plate, no sliding band */
  .lines {
    max-width: 36rem;
    font-family: "Noto Serif JP", serif;
    font-weight: 400;
    letter-spacing: 0.14em;
    line-height: 2.2;
    font-size: clamp(1.7rem, 5.4vw, 2.75rem);
    text-align: center;
    word-break: keep-all;
    overflow-wrap: break-word;
    text-shadow:
      0 2px 22px rgba(0,0,0,.95),
      0 1px 4px rgba(0,0,0,.95),
      0 0 32px rgba(0,0,0,.7),
      0 4px 48px rgba(0,0,0,.5);
  }
  .lines p { margin: 0.2em 0; }
  .lines .em {
    font-size: 1.12em;
    font-weight: 500;
  }
  .lines .em.mint {
    color: #7DFFB2;
    text-shadow:
      0 2px 22px rgba(0,0,0,.95),
      0 1px 4px rgba(0,0,0,.95),
      0 0 32px rgba(0,0,0,.7),
      0 0 26px rgba(125,255,178,.35);
  }
  body.particles-ready .beat .lines {
    visibility: hidden;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #glyph-canvas { display: none; }
    body.particles-ready .beat .lines { visibility: visible; }
  }
  .cta {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem 6rem;
    text-align: center;
  }
  .cta-inner {
    width: 100%; max-width: 30rem;
    opacity: 0;
    transition: opacity 0.9s ease-out;
  }
  .cta-inner.visible { opacity: 1; }
  .eyebrow { color: rgba(255,255,255,.65); font-size: .8rem; letter-spacing: .2em; margin-bottom: 1rem; }
  .cta h2 {
    font-family: "Noto Serif JP", serif;
    font-weight: 400;
    /* sized so 「場所に縛られない働き方を、」 (13 chars) fits one line down to 320px without mid-word breaks */
    font-size: clamp(1.35rem, 5.6vw, 2rem);
    letter-spacing: .1em;
    word-break: keep-all;
    margin-bottom: 1.2rem;
  }
  form { display: flex; flex-direction: column; gap: 1rem; }
  input[type=email] {
    width: 100%; padding: 1rem 1.4rem;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: .5rem;
    color: #fff; font-size: 1rem;
    font-family: inherit;
  }
  input[type=email]::placeholder { color: rgba(255,255,255,.4); }
  input[type=email]:focus { outline: none; border-color: rgba(212,165,116,.5); background: rgba(255,255,255,.1); }
  button {
    width: 100%; padding: 1rem 2rem;
    background: var(--accent); color: #111;
    border: 0; border-radius: .5rem;
    font-size: 1.05rem; font-weight: 500;
    font-family: inherit; cursor: pointer;
  }
  .hint { color: rgba(255,255,255,.55); font-size: .75rem; margin-top: .2rem; }
  /* Soft mid CTA (v22): text-link only, between scene 3 and scene 4 */
  .mid-cta {
    min-height: 48svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
  }
  .mid-cta-link {
    font-family: "Noto Serif JP", serif;
    font-size: 1rem;
    letter-spacing: .18em;
    color: rgba(255,255,255,.82);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,.35);
    padding-bottom: .45em;
    text-shadow: 0 1px 12px rgba(0,0,0,.8);
    transition: color .25s ease, border-color .25s ease;
  }
  .mid-cta-link:hover, .mid-cta-link:focus-visible {
    color: #fff;
    border-bottom-color: rgba(255,255,255,.85);
  }
  footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.3); font-size: .75rem; letter-spacing: .12em; }
  footer .legal-links { margin-top: 1rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
  footer .legal-links a { color: rgba(255,255,255,.35); text-decoration: none; transition: color .2s; }
  footer .legal-links a:hover { color: rgba(255,255,255,.55); }
  /* Mobile (default): compact short lines */
  @media (max-width: 768px) {
    .lines { letter-spacing: .07em; line-height: 2; font-size: clamp(1.55rem, 6.4vw, 2.15rem); }
    /* Scene 3's em line 「ひとりでつくるものじゃない。」 (14 chars) overflows ~390px viewports:
       shrink + tighten so the full line fits (fallback for reduced-motion / pre-paint) */
    section[data-scene="3"] .lines { font-size: clamp(1.05rem, 5.2vw, 2rem); letter-spacing: .04em; }
  }
  /* Desktop: wider layout, larger type, fewer breaks (v21: telops ~+25-30%) */
  @media (min-width: 769px) {
    br.sp { display: none; }
    .lines {
      max-width: 70rem;
      font-size: clamp(2.5rem, 3.6vw, 3.9rem);
      letter-spacing: .12em;
      line-height: 2;
    }
    /* Portrait stills on wide screens: cover fills edge-to-edge (no letterbox bars);
       anchor to the bottom so the lower portion of the scene stays in frame
       instead of magnifying the middle of the mountain. */
    .bg { background-position: center bottom; }
    /* v21: larger CTA heading on desktop; wider inner column so the keep-all
       h2 line fits, while the UTAGE form and footer keep their 30rem width */
    .cta-inner { max-width: 40rem; }
    .cta h2 { font-size: clamp(2rem, 3.2vw, 2.6rem); }
    .cta form, .cta footer { max-width: 30rem; margin-inline: auto; }
  }
  /* Ken Burns animation - reduced scale for less crop */
  @keyframes kenburns {
    0% { transform: scale(1); }
    100% { transform: scale(1.03); }
  }
  .bg {
    transform-origin: center center;
  }
  @media (min-width: 769px) {
    /* Ken Burns zoom grows from the bottom edge too, preserving the desktop crop */
    .bg { transform-origin: center bottom; }
  }
  .bg.kb-active {
    animation: kenburns 14s ease-out forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .bg.kb-active { animation: none; }
  }
  /* Film grain overlay */
  .grain {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    background-repeat: repeat;
  }
</style>
</head>
