<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="自由な暮らしを始めるために、最初に整えるべき環境と具体的なステップを無料セミナーでお伝えします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --accent: #d4a574; --accent-light: #e8c39a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a0a0a; color: #fff; }
  body { font-family: "Noto Sans JP", sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  .bg {
    position: fixed; top: 0; left: 0; right: 0; z-index: 0;
    height: 100svh;
    transition: opacity 0.8s ease;
    pointer-events: none;
    background-color: #14110e;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,8,10,.06) 0%, rgba(8,8,10,.12) 50%, rgba(8,8,10,.08) 100%);
  }
  #bg6::after {
    background: linear-gradient(180deg, rgba(8,8,10,.06) 0%, rgba(8,8,10,.12) 30%, transparent 50%),
                linear-gradient(to top, rgba(8,8,10,.55) 0%, rgba(8,8,10,.22) 40%, transparent 70%);
  }
  /* Background mapping (v13):
     bg1 (morning wake) ← scene-5.jpg (dawn coffee)
     bg2 (travel/freedom) ← scene-2.jpg (coastal road)
     bg3 (community) ← scene-3.jpg (van interior mountain) — NEEDS REPLACE with group/camp photo
     bg4 (work+life) ← scene-4.jpg (laptop/work)
     bg5 (decision/sunset) ← scene-1.jpg
     bg6 (CTA) ← scene-6.jpg (dusk/calm)
  */
  #bg1 { background-image: url("scene-5.jpg"); }
  #bg2 { background-image: url("scene-2.jpg"); }
  #bg3 { background-image: url("scene-3.jpg"); }
  #bg4 { background-image: url("scene-4.jpg"); }
  #bg5 { background-image: url("scene-1.jpg"); }
  #bg6 { background-image: url("scene-6.jpg"); }
  .content { position: relative; z-index: 1; }
  section.beat {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.25rem;
  }
  .lines {
    max-width: 36rem;
    font-family: "Noto Serif JP", serif;
    font-weight: 400;
    letter-spacing: 0.14em;
    line-height: 2.2;
    font-size: clamp(1.7rem, 5.4vw, 2.75rem);
    text-align: center;
    text-shadow: 0 2px 18px rgba(0,0,0,.9), 0 1px 3px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.55);
    background: rgba(0,0,0,.20);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    padding: 1.5rem 1.2rem;
    border-radius: 0.625rem;
  }
  .lines p { margin: 0.2em 0; }
  .lines .em {
    font-size: 1.12em;
    font-weight: 500;
  }
  .lines p .ch {
    display: inline-block;
    will-change: transform, opacity, filter;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .cta {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem 6rem;
    text-align: center;
  }
  .cta-inner { width: 100%; max-width: 28rem; }
  .eyebrow { color: rgba(255,255,255,.65); font-size: .8rem; letter-spacing: .2em; margin-bottom: 1rem; }
  .cta h2 {
    font-family: "Noto Serif JP", serif;
    font-weight: 400;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    letter-spacing: .14em;
    margin-bottom: 1.2rem;
  }
  .cta .lead { color: rgba(255,255,255,.85); font-size: 1.05rem; line-height: 1.9; margin-bottom: 2rem; }
  form { display: flex; flex-direction: column; gap: 1rem; }
  input[type=email] {
    width: 100%; padding: 1rem 1.4rem;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: .5rem;
    color: #fff; font-size: 1rem;
    font-family: inherit;
  }
  input[type=email]::placeholder { color: rgba(255,255,255,.4); }
  input[type=email]:focus { outline: none; border-color: rgba(212,165,116,.5); background: rgba(255,255,255,.1); }
  button {
    width: 100%; padding: 1rem 2rem;
    background: var(--accent); color: #111;
    border: 0; border-radius: .5rem;
    font-size: 1.05rem; font-weight: 500;
    font-family: inherit; cursor: pointer;
  }
  .hint { color: rgba(255,255,255,.55); font-size: .75rem; margin-top: .2rem; }
  footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.3); font-size: .75rem; letter-spacing: .12em; }
  footer .legal-links { margin-top: 1rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
  footer .legal-links a { color: rgba(255,255,255,.35); text-decoration: none; transition: color .2s; }
  footer .legal-links a:hover { color: rgba(255,255,255,.55); }
  /* Mobile (default): compact short lines */
  @media (max-width: 768px) {
    .lines { letter-spacing: .07em; line-height: 2; font-size: clamp(1.55rem, 6.4vw, 2.15rem); }
  }
  /* Desktop: wider layout, larger type, fewer breaks */
  @media (min-width: 769px) {
    br.sp { display: none; }
    .lines {
      max-width: 52rem;
      font-size: clamp(2rem, 2.8vw, 3rem);
      letter-spacing: .12em;
      line-height: 2;
    }
  }
  /* Ken Burns animation */
  @keyframes kenburns {
    0% { transform: scale(1); }
    100% { transform: scale(1.06); }
  }
  .bg {
    transform-origin: center center;
  }
  .bg.kb-active {
    animation: kenburns 14s ease-out forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .bg.kb-active { animation: none; }
  }
  /* Film grain overlay */
  .grain {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    background-repeat: repeat;
  }
</style>
</head>
<body>
  <div id="bg1" class="bg kb-active" style="opacity:1"></div>
  <div id="bg2" class="bg" style="opacity:0"></div>
  <div id="bg3" class="bg" style="opacity:0"></div>
  <div id="bg4" class="bg" style="opacity:0"></div>
  <div id="bg5" class="bg" style="opacity:0"></div>
  <div id="bg6" class="bg" style="opacity:0"></div>
  <div class="grain"></div>

  <div class="content">
    <section class="beat" data-scene="1">
      <div class="lines">
        <p>明日、あなたが目覚める場所は、<br><span class="em">どこですか。</span></p>
      </div>
    </section>
    <section class="beat" data-scene="2">
      <div class="lines">
        <p><span class="em">好きな場所</span>で、<br class="sp">生きていく。</p>
      </div>
    </section>
    <!-- NOTE: Scene 3 NEEDS REPLACE - current assets lack real community/camp group photo -->
    <section class="beat" data-scene="3">
      <div class="lines">
        <p>自由は、<br><span class="em">ひとりでつくるものじゃない。</span></p>
      </div>
    </section>
    <section class="beat" data-scene="4">
      <div class="lines">
        <p>暮らしも、仕事も。<br><span class="em">どちらも諦めない。</span></p>
      </div>
    </section>
    <section class="beat" data-scene="5">
      <div class="lines">
        <p>いつかじゃない。<br><span class="em">今日、変わろう。</span></p>
      </div>
    </section>
    <section class="cta" data-scene="6">
      <div class="cta-inner">
        <p class="eyebrow">期間限定・無料セミナー</p>
        <h2>場所に縛られない働き方を、<br class="sp">ここから。</h2>
        <p class="lead">自由な暮らしを始めるために、<br class="sp">最初に整えるべき環境と具体的なステップを、<br class="sp">無料セミナーでお伝えします。</p>
        <form id="form" action="https://utage-system.com/r/nLIjbJDSiDdp/store" method="post">
          <input type="hidden" name="redirect_url" value="https://utage-system.com/p/ithxISVdorRw">
          <input type="email" name="mail" id="mail" placeholder="メールアドレスを入力" required autocomplete="email">
          <button type="submit">今すぐ無料で参加する</button>
          <p class="hint">※ いつでも配信解除できます</p>
        </form>
        <footer>
          <p>© たっちゃん</p>
          <p class="legal-links">
            <a href="https://utage-system.com/p/VWl7E9xCqsUQ" target="_blank" rel="noopener">特定商取引法に基づく表記</a>
            <a href="https://utage-system.com/p/9iPhkFUE9cUo" target="_blank" rel="noopener">プライバシーポリシー</a>
          </p>
        </footer>
      </div>
    </section>
  </div>
<script>
(function () {
  var bgs = [null,
    document.getElementById("bg1"),
    document.getElementById("bg2"),
    document.getElementById("bg3"),
    document.getElementById("bg4"),
    document.getElementById("bg5"),
    document.getElementById("bg6")
  ];

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function ease(t) { return t * t * (3 - 2 * t); }
  function assembleAmount(n) {
    // n = line midpoint / viewport height (0=top, 1=bottom)
    // below: particles incoming. center: text readable (hold). above: particles dissolve.
    if (n > 0.90) return 0;
    if (n > 0.70) return ease(1 - (n - 0.70) / 0.20); // converge while rising (0.70 → 0.90)
    if (n >= 0.22) return 1;                          // hold (0.22 → 0.70)
    if (n > 0.06) return ease((n - 0.06) / 0.16);     // dissolve upward (0.06 → 0.22)
    return 0;
  }

  var lines = [];
  document.querySelectorAll(".lines p").forEach(function (p) {
    var nodes = [];
    var charIndex = 0;
    function walk(node, emWrap) {
      if (node.nodeType === 3) {
        var txt = node.textContent;
        for (var i = 0; i < txt.length; i++) {
          nodes.push({ type: "char", char: txt.charAt(i), idx: charIndex++, em: emWrap });
        }
      } else if (node.nodeName === "BR") {
        nodes.push({ type: "br", el: node.cloneNode(true) });
      } else if (node.nodeName === "SPAN" && node.classList.contains("em")) {
        node.childNodes.forEach(function (child) { walk(child, true); });
      } else {
        node.childNodes.forEach(function (child) { walk(child, emWrap); });
      }
    }
    p.childNodes.forEach(function (node) { walk(node, false); });
    p.textContent = "";
    var chars = [];
    var currentEmSpan = null;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.type === "br") {
        currentEmSpan = null;
        p.appendChild(n.el);
      } else {
        var span = document.createElement("span");
        span.className = "ch";
        span.textContent = n.char === " " ? "\u00A0" : n.char;
        var incoming = {
          x: (Math.random() - 0.5) * 160,
          y: 90 + Math.random() * 140,
          r: (Math.random() - 0.5) * 50,
          s: 0.12 + Math.random() * 0.28
        };
        var outgoing = {
          x: (Math.random() - 0.5) * 180,
          y: -(90 + Math.random() * 150),
          r: (Math.random() - 0.5) * 60,
          s: 0.1 + Math.random() * 0.28
        };
        if (n.em) {
          if (!currentEmSpan) {
            currentEmSpan = document.createElement("span");
            currentEmSpan.className = "em";
            p.appendChild(currentEmSpan);
          }
          currentEmSpan.appendChild(span);
        } else {
          currentEmSpan = null;
          p.appendChild(span);
        }
        chars.push({ el: span, inn: incoming, out: outgoing });
      }
    }
    lines.push({ p: p, chars: chars });
  });

  function setChar(ch, from, t) {
    var k = 1 - t;
    var x = from.x * k;
    var y = from.y * k;
    var r = from.r * k;
    var s = 1 + (from.s - 1) * k;
    var o = 0.08 + 0.9 * t;
    var blur = (1 - t) * 2.4;
    ch.el.style.opacity = o.toFixed(3);
    ch.el.style.filter = "blur(" + blur.toFixed(2) + "px)";
    ch.el.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0) scale(" + s.toFixed(2) + ") rotate(" + r.toFixed(1) + "deg)";
  }

  function tick() {
    var vh = window.innerHeight || 1;
    var active = 1;
    document.querySelectorAll("[data-scene]").forEach(function (sec) {
      var r = sec.getBoundingClientRect();
      if (r.top < vh * 0.55 && r.bottom > vh * 0.35) {
        active = Number(sec.getAttribute("data-scene"));
      }
    });
    for (var i = 1; i < bgs.length; i++) {
      if (bgs[i]) {
        var isActive = i === active;
        bgs[i].style.opacity = isActive ? "1" : "0";
        if (isActive && !bgs[i].classList.contains("kb-active")) {
          bgs[i].classList.remove("kb-active");
          void bgs[i].offsetWidth; // force reflow to restart animation
          bgs[i].classList.add("kb-active");
        } else if (!isActive) {
          bgs[i].classList.remove("kb-active");
        }
      }
    }

    for (var L = 0; L < lines.length; L++) {
      var line = lines[L];
      var rec = line.p.getBoundingClientRect();
      var n = (rec.top + rec.height * 0.5) / vh;
      var t = assembleAmount(n);
      var fromBelow = n > 0.5;
      for (var c = 0; c < line.chars.length; c++) {
        setChar(line.chars[c], fromBelow ? line.chars[c].inn : line.chars[c].out, t);
      }
    }
  }

  var locked = false;
  function requestTick() {
    if (locked) return;
    locked = true;
    requestAnimationFrame(function () {
      tick();
      locked = false;
    });
  }

  window.addEventListener("scroll", requestTick, { passive: true });
  window.addEventListener("touchmove", requestTick, { passive: true });
  window.addEventListener("touchstart", requestTick, { passive: true });
  window.addEventListener("wheel", requestTick, { passive: true });
  window.addEventListener("resize", requestTick);
  document.addEventListener("visibilitychange", requestTick);
  tick();

})();
</script>
</body>
</html>
