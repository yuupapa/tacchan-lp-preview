<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>場所に縛られない働き方｜期間限定</title>
<meta name="description" content="自由な暮らしを始めるために、最初に整えるべき環境と具体的なステップを無料セミナーでお伝えします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* v24: mid label 「ここから。」; both form buttons 「無料動画セミナーを今すぐ受け取る」 with play icon, thicker; final receive block (期間限定 / 無料動画セミナーを／今すぐ受け取る / 登録後すぐに案内が届きます) before the form; compact face-less intro strip under the raised scene-2 telop. v23: mid CTA is a full UTAGE email form carrying data-scene="3"; scene 3/4 stills regenerated; title trimmed to 期間限定. v22: locked copy; wide-FOV film stills. v21: desktop telops enlarged (~+29%). v20: desktop bg cover anchored bottom; text anchor locked against iOS URL-bar scroll drift */
  :root { --accent: #d4a574; --accent-light: #e8c39a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a0a0a; color: #fff; }
  body { font-family: "Noto Sans JP", sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  .bg {
    position: fixed; top: 0; left: 0; right: 0; z-index: 0;
    height: 100svh;
    transition: opacity 0.8s ease;
    pointer-events: none;
    background-color: #14110e;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,8,10,.06) 0%, rgba(8,8,10,.12) 50%, rgba(8,8,10,.08) 100%);
  }
  #bg6::after {
    background: linear-gradient(180deg, rgba(8,8,10,.06) 0%, rgba(8,8,10,.12) 30%, transparent 50%),
                linear-gradient(to top, rgba(8,8,10,.55) 0%, rgba(8,8,10,.22) 40%, transparent 70%);
  }
  /* Background mapping (v23): scene 3/4 regenerated per design review
     bg1 (morning wake) ← scene-morning.jpg (tiny camper van on vast misty dawn lakeshore)
     bg2 (travel/freedom) ← scene-travel.jpg (tiny van on sweeping coastal morning road)
     bg3 (community/仲間) ← scene-community.jpg (dusk lakeside workation camp: tiny group around a campfire with laptops, van at the edge)
     bg4 (work+life) ← scene-work.jpg (bright outdoor coworking group at a wooden table + van in a mountain meadow)
     bg5 (decision/夕日) ← scene-sunset.jpg (bottom-weighted sunset sky, tiny van silhouette)
     bg6 (CTA) ← scene-dusk.jpg (dark blue-hour calm, tiny warm van window light)
  */
  #bg1 { background-image: url("scene-morning.jpg?v=24"); }
  #bg2 { background-image: url("scene-travel.jpg?v=24"); }
  #bg3 { background-image: url("scene-community.jpg?v=24"); }
  #bg4 { background-image: url("scene-work.jpg?v=24"); }
  #bg5 { background-image: url("scene-sunset.jpg?v=24"); }
  #bg6 { background-image: url("scene-dusk.jpg?v=24"); }
  #glyph-canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 2;
    pointer-events: none;
    /* sized in explicit px by particles.js, never stretched by CSS —
       keeps the text anchor fixed when the iOS URL bar shows/hides */
  }
  .content { position: relative; z-index: 3; }
  section.beat {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.25rem;
  }
  /* Fallback / reduced-motion text — no plate, no sliding band */
  .lines {
    max-width: 36rem;
    font-family: "Noto Serif JP", serif;
    font-weight: 400;
    letter-spacing: 0.14em;
    line-height: 2.2;
    font-size: clamp(1.7rem, 5.4vw, 2.75rem);
    text-align: center;
    word-break: keep-all;
    overflow-wrap: break-word;
    text-shadow:
      0 2px 22px rgba(0,0,0,.95),
      0 1px 4px rgba(0,0,0,.95),
      0 0 32px rgba(0,0,0,.7),
      0 4px 48px rgba(0,0,0,.5);
  }
  .lines p { margin: 0.2em 0; }
  .lines .em {
    font-size: 1.12em;
    font-weight: 500;
  }
  .lines .em.mint {
    color: #7DFFB2;
    text-shadow:
      0 2px 22px rgba(0,0,0,.95),
      0 1px 4px rgba(0,0,0,.95),
      0 0 32px rgba(0,0,0,.7),
      0 0 26px rgba(125,255,178,.35);
  }
  body.particles-ready .beat .lines {
    visibility: hidden;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #glyph-canvas { display: none; }
    body.particles-ready .beat .lines { visibility: visible; }
  }
  .cta {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem 6rem;
    text-align: center;
  }
  .cta-inner {
    width: 100%; max-width: 30rem;
    opacity: 0;
    transition: opacity 0.9s ease-out;
  }
  .cta-inner.visible { opacity: 1; }
  .eyebrow { color: rgba(255,255,255,.65); font-size: .8rem; letter-spacing: .2em; margin-bottom: 1rem; }
  .cta h2 {
    font-family: "Noto Serif JP", serif;
    font-weight: 400;
    /* v24: two short lines (無料動画セミナーを／今すぐ受け取る); keep-all guards against mid-word breaks */
    font-size: clamp(1.35rem, 5.6vw, 2rem);
    letter-spacing: .1em;
    word-break: keep-all;
    margin-bottom: .9rem;
  }
  .cta-lead {
    color: rgba(255,255,255,.75);
    font-size: .85rem;
    letter-spacing: .12em;
    margin-bottom: 1.8rem;
  }
  form { display: flex; flex-direction: column; gap: 1rem; }
  input[type=email] {
    width: 100%; padding: 1rem 1.4rem;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: .5rem;
    color: #fff; font-size: 1rem;
    font-family: inherit;
  }
  input[type=email]::placeholder { color: rgba(255,255,255,.4); }
  input[type=email]:focus { outline: none; border-color: rgba(212,165,116,.5); background: rgba(255,255,255,.1); }
  /* v24: thicker CTA button with play icon; font shrinks on narrow phones so
     「無料動画セミナーを今すぐ受け取る」 (15 chars) stays on one line down to 320px */
  button {
    width: 100%; padding: 1.15rem 1.2rem;
    background: var(--accent); color: #111;
    border: 0; border-radius: .5rem;
    font-size: clamp(.88rem, 4vw, 1.05rem); font-weight: 600;
    font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    line-height: 1.4;
    transition: filter .2s;
  }
  button:hover { filter: brightness(1.07); }
  button .play { width: .95em; height: .95em; flex: none; }
  .hint { color: rgba(255,255,255,.55); font-size: .75rem; margin-top: .2rem; }
  /* Mid CTA (v23): full email form between scene 3 and scene 4, same UTAGE
     endpoint as the final CTA. Compact vertical footprint (no min-height);
     data-scene="3" keeps the community background while the form is in view. */
  .mid-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
    text-align: center;
  }
  .mid-cta-inner { width: 100%; max-width: 30rem; }
  .mid-cta-label {
    font-family: "Noto Serif JP", serif;
    font-size: 1rem;
    letter-spacing: .18em;
    color: rgba(255,255,255,.82);
    margin-bottom: 1.6rem;
    text-shadow: 0 1px 12px rgba(0,0,0,.8);
  }
  /* Intro strip (v24): compact face-less profile pinned to the lower part of
     scene 2; the telop above it is raised by particles.js (lift). Visible by
     default so no-JS still shows it; body.intro-js arms the fade-in. */
  section[data-scene="2"] { position: relative; }
  .intro {
    position: absolute;
    left: 50%;
    bottom: 9%;
    transform: translate(-50%, 0);
    display: flex;
    align-items: center;
    gap: .9rem;
    text-align: left;
  }
  body.intro-js .intro {
    opacity: 0;
    transform: translate(-50%, 10px);
    transition: opacity 1s ease .15s, transform 1s ease .15s;
  }
  body.intro-js .intro.visible { opacity: 1; transform: translate(-50%, 0); }
  .intro-photo {
    width: 3.4rem; height: 3.4rem;
    border-radius: 50%;
    object-fit: cover;
    flex: none;
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: 0 6px 22px rgba(0,0,0,.55);
  }
  .intro-text {
    font-size: clamp(.72rem, 3.4vw, .82rem);
    line-height: 1.95;
    letter-spacing: .05em;
    color: rgba(255,255,255,.88);
    text-shadow: 0 1px 10px rgba(0,0,0,.9), 0 0 22px rgba(0,0,0,.65);
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .intro-text .intro-name { font-weight: 600; color: #fff; }
  footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.3); font-size: .75rem; letter-spacing: .12em; }
  footer .legal-links { margin-top: 1rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
  footer .legal-links a { color: rgba(255,255,255,.35); text-decoration: none; transition: color .2s; }
  footer .legal-links a:hover { color: rgba(255,255,255,.55); }
  /* Mobile (default): compact short lines */
  @media (max-width: 768px) {
    .lines { letter-spacing: .07em; line-height: 2; font-size: clamp(1.55rem, 6.4vw, 2.15rem); }
    /* Scene 3's em line 「ひとりでつくるものじゃない。」 (14 chars) overflows ~390px viewports:
       shrink + tighten so the full line fits (fallback for reduced-motion / pre-paint) */
    section[data-scene="3"] .lines { font-size: clamp(1.05rem, 5.2vw, 2rem); letter-spacing: .04em; }
  }
  /* Desktop: wider layout, larger type, fewer breaks (v21: telops ~+25-30%) */
  @media (min-width: 769px) {
    br.sp { display: none; }
    .lines {
      max-width: 70rem;
      font-size: clamp(2.5rem, 3.6vw, 3.9rem);
      letter-spacing: .12em;
      line-height: 2;
    }
    /* Portrait stills on wide screens: cover fills edge-to-edge (no letterbox bars);
       anchor to the bottom so the lower portion of the scene stays in frame
       instead of magnifying the middle of the mountain. */
    .bg { background-position: center bottom; }
    /* v21: larger CTA heading on desktop; wider inner column so the keep-all
       h2 line fits, while the UTAGE form and footer keep their 30rem width */
    .cta-inner { max-width: 40rem; }
    .cta h2 { font-size: clamp(2rem, 3.2vw, 2.6rem); }
    .cta form, .cta footer { max-width: 30rem; margin-inline: auto; }
    .intro { gap: 1.1rem; bottom: 10%; }
    .intro-photo { width: 4.2rem; height: 4.2rem; }
    .intro-text { font-size: .92rem; }
  }
  /* Ken Burns animation - reduced scale for less crop */
  @keyframes kenburns {
    0% { transform: scale(1); }
    100% { transform: scale(1.03); }
  }
  .bg {
    transform-origin: center center;
  }
  @media (min-width: 769px) {
    /* Ken Burns zoom grows from the bottom edge too, preserving the desktop crop */
    .bg { transform-origin: center bottom; }
  }
  .bg.kb-active {
    animation: kenburns 14s ease-out forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .bg.kb-active { animation: none; }
  }
  /* Film grain overlay */
  .grain {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    background-repeat: repeat;
  }
</style>
</head>
<body>
  <div id="bg1" class="bg kb-active" style="opacity:1"></div>
  <div id="bg2" class="bg" style="opacity:0"></div>
  <div id="bg3" class="bg" style="opacity:0"></div>
  <div id="bg4" class="bg" style="opacity:0"></div>
  <div id="bg5" class="bg" style="opacity:0"></div>
  <div id="bg6" class="bg" style="opacity:0"></div>
  <div class="grain"></div>

  <div class="content">
    <section class="beat" data-scene="1">

        <form action="https://utage-system.com/r/nLIjbJDSiDdp/store" method="post">

    <section class="beat" data-scene="4">

        <p>暮らしも、仕事も。<br><span class="em">どちらも諦めない。</span></p>
      </div>
    </section>
    <section class="beat" data-scene="5">
      <div class="lines">
        <p>いつかじゃない。<br><span class="em mint">今日、変わろう。</span></p>
      </div>
    </section>
    <section class="cta" id="form" data-scene="6">
      <div class="cta-inner">
        <p class="eyebrow">期間限定</p>
        <h2>無料動画セミナーを<br>今すぐ受け取る</h2>
        <p class="cta-lead">登録後すぐに案内が届きます</p>
        <form action="https://utage-system.com/r/nLIjbJDSiDdp/store" method="post">
          <input type="hidden" name="redirect_url" value="https://utage-system.com/p/ithxISVdorRw">
          <input type="email" name="mail" id="mail" placeholder="メールアドレスを入力" required autocomplete="email">
          <button type="submit"><svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg>無料動画セミナーを今すぐ受け取る</button>
          <p class="hint">※ いつでも配信解除できます</p>
        </form>
        <footer>
          <p>© 株式会社ラフレンダリング</p>
          <p class="legal-links">
            <a href="https://utage-system.com/p/VWl7E9xCqsUQ" target="_blank" rel="noopener">特定商取引法に基づく表記</a>
            <a href="https://utage-system.com/p/9iPhkFUE9cUo" target="_blank" rel="noopener">プライバシーポリシー</a>
          </p>
        </footer>
      </div>
    </section>
  </div>
<script src="particles.js?v=24"></script>
</body>
</html>
